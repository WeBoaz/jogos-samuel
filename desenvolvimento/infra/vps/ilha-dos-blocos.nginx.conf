# /etc/nginx/conf.d/ilha-dos-blocos.conf — servidor da Ilha dos Blocos em https/wss na porta 8443.
# Porta própria porque o cliente do Voxelize sempre usa /ws/ e /registry/ na raiz, que é do painel de jogos (AMP).
# Reaproveita o certificado Let's Encrypt do hostname (renovado pelo certbot já instalado).
# Só três rotas passam: /ws/ (só vindo do samuel.tech, com limite por IP), /registry/ (GET) e /saude. O resto é 404.

limit_req_zone  $binary_remote_addr zone=ilha_ws:1m rate=60r/m;   # reconexão automática do motor ~3 s; famílias atrás do mesmo roteador
limit_conn_zone $binary_remote_addr zone=ilha_con:1m;

map $http_origin $ilha_origem_ok {
    default                 0;
    "https://samuel.tech"   1;
    "https://www.samuel.tech" 1;
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name srv2114451.hstgr.cloud;

    ssl_certificate /etc/letsencrypt/live/srv2114451.hstgr.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/srv2114451.hstgr.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # sem logs com IP nem query string (a URL do WebSocket leva o código da ilha)
    access_log off;
    error_log /var/log/nginx/ilha-erros.log crit;
    client_max_body_size 64k;

    location = /ws/ {
        if ($ilha_origem_ok = 0) { return 403; }
        limit_req zone=ilha_ws burst=20 nodelay;
        limit_conn ilha_con 6;
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location ^~ /registry/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host $host;
    }

    # saúde: responde (com CORS do servidor) só se o servidor da ilha estiver de pé
    location = /saude {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:4100/;
        proxy_set_header Host $host;
    }

    location / { return 404; }
}
