<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — samuel.tech</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1B1036">
<link rel="icon" type="image/svg+xml" href="../assets/img/marca/icone.svg">
<link rel="apple-touch-icon" href="../assets/img/marca/icone-180.png">
<link rel="stylesheet" href="../assets/css/samuel.css">
<style>
  body { display: flex; flex-direction: column; min-height: 100vh; }
  .palco { flex: 1; display: grid; place-items: center; padding: 40px 16px; }
  .janela { width: min(640px, 100%); }
  .janela__corpo { text-align: center; padding: 28px 20px; }
  .voltar { color: var(--papel); font-size: 22px; margin-bottom: 16px; display: inline-block; }
  .logo { height: 44px; image-rendering: pixelated; margin-bottom: 24px; }

  .etapa[hidden] { display: none; }
  .etapa h1 { font-size: clamp(14px, 3.4vw, 20px); margin-bottom: 8px; }
  .etapa .dica { font-size: 24px; color: #3A3350; margin-bottom: 24px; }

  /* escolha do jogador */
  .jogadores { display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; }
  .jogador {
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    background: var(--cor); padding: 16px 16px 14px; border: 0; cursor: pointer;
    font-family: var(--fonte-titulo); font-size: 12px; color: var(--tinta);
    box-shadow: inset -4px -4px 0 rgba(0,0,0,.25), inset 4px 4px 0 rgba(255,255,255,.5), 0 0 0 4px var(--noite), var(--sombra-bloco);
    transition: transform .08s steps(2);
  }
  .jogador:hover { transform: translateY(-6px); }
  .jogador:active { transform: translate(4px, 4px); }
  .jogador img { width: 128px; height: 128px; image-rendering: pixelated; box-shadow: 0 0 0 4px var(--noite); }

  /* senha de blocos */
  .quem { display: inline-flex; align-items: center; gap: 12px; font-family: var(--fonte-titulo); font-size: 12px; margin-bottom: 18px; }
  .quem img { width: 56px; height: 56px; image-rendering: pixelated; box-shadow: 0 0 0 3px var(--noite); }
  .casas { display: flex; gap: 14px; justify-content: center; margin-bottom: 24px; }
  .casa {
    width: 72px; height: 72px; display: grid; place-items: center;
    background: #8B8B8B; box-shadow: inset 4px 4px 0 #373737, inset -4px -4px 0 #fff;
  }
  .casa img { width: 56px; height: 56px; image-rendering: pixelated; animation: cai .18s steps(3); }
  @keyframes cai { from { transform: translateY(-16px) scale(1.2); } }
  .teclado { display: grid; grid-template-columns: repeat(3, 88px); gap: 16px; justify-content: center; margin-bottom: 22px; }
  .tecla {
    width: 88px; height: 88px; padding: 0; border: 0; cursor: pointer; background: none;
    box-shadow: 0 0 0 4px var(--noite), var(--sombra-bloco);
    transition: transform .06s steps(2);
  }
  .tecla img { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  .tecla:active { transform: translate(4px, 4px); box-shadow: 0 0 0 4px var(--noite); }
  .acoes { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  .msg { min-height: 32px; font-family: var(--fonte-titulo); font-size: 12px; margin-top: 18px; }
  .msg.ok { color: var(--grama-esc); }
  .msg.erro { color: var(--redstone); }
  .treme { animation: treme .4s steps(6); }
  @keyframes treme { 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
  .ajuda { font-size: 20px; color: #4A4360; margin-top: 18px; }

  @media (max-width: 420px) {
    .teclado { grid-template-columns: repeat(3, 76px); }
    .tecla { width: 76px; height: 76px; }
    .jogador img { width: 104px; height: 104px; }
  }
</style>
</head>
<body class="ceu--noite">

<main class="palco">
  <div class="centro">
    <a class="voltar" href="../">← Voltar ao início</a><br>
    <img class="logo" src="../assets/img/marca/logo-horizontal.svg" alt="samuel.tech">

    <section class="janela" aria-live="polite">
      <div class="janela__barra">
        <span><img class="icone" src="../assets/img/icones/chave.svg" alt="">ENTRAR.EXE</span>
        <span class="janela__botoes"><a href="../" aria-label="Fechar">×</a></span>
      </div>

      <div class="janela__corpo">
        <!-- ETAPA 1: quem vai jogar -->
        <div class="etapa" id="etapaQuem">
          <h1>Quem vai jogar?</h1>
          <p class="dica">Toque no seu herói.</p>
          <div class="jogadores" id="listaJogadores"></div>
        </div>

        <!-- ETAPA 2: senha de blocos -->
        <div class="etapa" id="etapaSenha" hidden>
          <div class="quem"><img id="quemAvatar" src="" alt=""><span id="quemNome"></span></div>
          <h1>Seus 3 blocos secretos</h1>
          <p class="dica">Toque nos blocos na ordem certa.</p>
          <div class="casas" id="casas" aria-label="Blocos escolhidos">
            <div class="casa"></div><div class="casa"></div><div class="casa"></div>
          </div>
          <div class="teclado" id="teclado"></div>
          <div class="acoes">
            <button class="btn btn--pequeno btn--pedra" type="button" id="btnApagar" data-som>⌫ Apagar</button>
            <button class="btn btn--pequeno btn--pedra" type="button" id="btnTrocar" data-som>👥 Trocar herói</button>
          </div>
          <p class="msg" id="msg" role="status"></p>
          <p class="ajuda">Esqueceu? Peça ajuda para um adulto. 😉</p>
        </div>
      </div>
      <div class="janela__status"><span>Pronto.</span><span id="status">Aguardando jogador…</span></div>
    </section>
  </div>
</main>
<div class="chao" aria-hidden="true"></div>

<button class="btn btn--pedra btn-som" type="button" data-botao-som aria-label="Som">🔊</button>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/catalogo.js"></script>
<script src="../assets/js/site.js"></script>
<script>
  (function () {
    const S = window.Samuel;
    const $ = (id) => document.getElementById(id);

    // Já está logado? vai direto pro baú.
    if (S.sessao.jogador()) { location.replace(S.url("jogos/")); return; }

    let jogador = null;
    let escolha = [];
    const blocoImg = (nome) => S.url(`assets/img/blocos/${nome}.svg`);

    // Etapa 1
    $("listaJogadores").innerHTML = S.jogadores.map((j) => `
      <button class="jogador" type="button" data-id="${j.id}" data-som="bloco" style="--cor:${j.cor}">
        <img src="${S.url(j.avatar)}" alt="">
        ${j.nome}
      </button>`).join("");
    $("listaJogadores").addEventListener("click", (e) => {
      const b = e.target.closest(".jogador");
      if (!b) return;
      jogador = S.jogadores.find((j) => j.id === b.dataset.id);
      $("quemAvatar").src = S.url(jogador.avatar);
      $("quemNome").textContent = `Oi, ${jogador.nome}!`;
      $("etapaQuem").hidden = true;
      $("etapaSenha").hidden = false;
      $("status").textContent = `Jogador: ${jogador.nome}`;
      limpar();
    });

    // Etapa 2
    $("teclado").innerHTML = window.SAMUEL_BLOCOS_SENHA.map((n) => `
      <button class="tecla" type="button" data-bloco="${n}" aria-label="Bloco de ${n}">
        <img src="${blocoImg(n)}" alt="">
      </button>`).join("");

    $("teclado").addEventListener("click", (e) => {
      const t = e.target.closest(".tecla");
      if (!t || escolha.length >= 3) return;
      escolha.push(t.dataset.bloco);
      S.som.tocar("bloco");
      desenharCasas();
      if (escolha.length === 3) setTimeout(conferir, 250);
    });

    function desenharCasas() {
      [...$("casas").children].forEach((c, i) => {
        c.innerHTML = escolha[i] ? `<img src="${blocoImg(escolha[i])}" alt="${escolha[i]}">` : "";
      });
    }
    function limpar() { escolha = []; desenharCasas(); $("msg").textContent = ""; $("msg").className = "msg"; }

    function conferir() {
      const certo = jogador.senha.every((b, i) => b === escolha[i]);
      if (certo) {
        $("msg").textContent = "Acertou! Abrindo o baú…";
        $("msg").className = "msg ok";
        $("status").textContent = "Acesso liberado ✔";
        S.som.tocar("sucesso");
        S.sessao.entrar(jogador.id);
        setTimeout(() => location.assign(S.url("jogos/")), 900);
      } else {
        $("msg").textContent = "Ops! Tente de novo.";
        $("msg").className = "msg erro";
        S.som.tocar("erro");
        const casas = $("casas");
        casas.classList.remove("treme"); void casas.offsetWidth; casas.classList.add("treme");
        setTimeout(() => { escolha = []; desenharCasas(); }, 600);
      }
    }

    $("btnApagar").addEventListener("click", () => { escolha.pop(); desenharCasas(); });
    $("btnTrocar").addEventListener("click", () => {
      $("etapaSenha").hidden = true; $("etapaQuem").hidden = false;
      $("status").textContent = "Aguardando jogador…";
    });
  })();
</script>
</body>
</html>
