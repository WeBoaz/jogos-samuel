<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jogos do Samuel</title>
<meta name="description" content="Os jogos do Samuel: escolha um e divirta-se.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
<style>
  :root {
    --bg: #1b1036;
    --card: #2a1858;
    --text: #fff7e6;
    --muted: #cbbbe8;
    --accent: #ffb703;
    --accent-2: #fb5607;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: radial-gradient(circle at 50% -10%, #4a2a8a, var(--bg) 60%);
    color: var(--text); font-family: "Trebuchet MS", system-ui, sans-serif;
  }
  main { max-width: 900px; margin: 0 auto; padding: 48px 16px 32px; }
  header { text-align: center; margin-bottom: 40px; }
  h1 {
    font-size: clamp(36px, 8vw, 64px); margin: 0;
    color: var(--accent); text-shadow: 4px 4px 0 var(--accent-2);
  }
  header p { color: var(--muted); font-size: 18px; margin: 12px 0 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
  .game {
    display: block; text-decoration: none; color: inherit;
    background: var(--card); border: 3px solid transparent; border-radius: 20px;
    overflow: hidden; transition: transform .15s, border-color .15s;
    box-shadow: 0 8px 24px rgba(0,0,0,.35);
  }
  a.game:hover, a.game:focus-visible { transform: translateY(-6px) rotate(-1deg); border-color: var(--accent); outline: none; }
  .thumb {
    height: 150px; display: grid; place-items: center; font-size: 72px;
    background: linear-gradient(135deg, #3a1f6e, #120a28);
    position: relative; overflow: hidden;
  }
  .thumb .blocks { position: absolute; top: 14px; left: 0; right: 0; display: flex; justify-content: center; gap: 6px; }
  .thumb .blocks span { width: 30px; height: 16px; border-radius: 4px; }
  .info { padding: 16px 18px 20px; }
  .info h2 { margin: 0 0 6px; font-size: 22px; }
  .info p { margin: 0; color: var(--muted); line-height: 1.4; }
  .play {
    display: inline-block; margin-top: 14px; padding: 8px 18px; border-radius: 12px;
    background: linear-gradient(var(--accent), var(--accent-2)); color: #2a0d00; font-weight: bold;
  }
  .soon { opacity: .55; border-style: dashed; border-color: var(--muted); }
  footer { text-align: center; color: var(--muted); font-size: 14px; margin-top: 48px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>🎮 Jogos do Samuel</h1>
    <p>Escolha um jogo e divirta-se!</p>
  </header>

  <section class="grid">
    <a class="game" href="dragoes-e-blocos/">
      <div class="thumb">
        <div class="blocks">
          <span style="background:#4cc9f0"></span><span style="background:#f72585"></span><span style="background:#ffd60a"></span><span style="background:#4cc9f0"></span><span style="background:#f72585"></span>
        </div>
        🐉
      </div>
      <div class="info">
        <h2>Dragões &amp; Blocos</h2>
        <p>Cuspa fogo e derrube a muralha de blocos antes que ela chegue no seu dragão.</p>
        <span class="play">Jogar ▶</span>
      </div>
    </a>

    <div class="game soon" aria-disabled="true">
      <div class="thumb">❓</div>
      <div class="info">
        <h2>Em breve</h2>
        <p>O próximo jogo está sendo inventado.</p>
      </div>
    </div>
  </section>

  <footer>Feito com 💛 para o Samuel</footer>
</main>
</body>
</html>
